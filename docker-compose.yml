services:
  postgres:
    image: postgres:16
    container_name: rapidaid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rapidaid_db
      POSTGRES_USER: rapidaid
      POSTGRES_PASSWORD: rapidaid123
    ports:
      - "5432:5432"
    volumes:
      - rapidaid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapidaid -d rapidaid_db"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rapidaid_postgres_data:
